<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="PostPilot">
  <title>PostPilot</title>
  <!--
    One post (the rounded square) fanning out to three destinations.
    The whole mark is tilted so it climbs: level and symmetrical, it reads as
    the universal share glyph, and a logo that looks like a system icon is not
    a logo. Ink uses currentColor so it works in light and dark; the origin
    holds the brand magenta in both.
  -->
  <g transform="rotate(-15 24 24)">
    <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".92">
      <path d="M19.4 21.4C24.8 18 29.2 15.6 32.8 14.2" />
      <path d="M20 24h12.8" />
      <path d="M19.4 26.6C24.8 30 29.2 32.4 32.8 33.8" />
    </g>
    <g fill="currentColor">
      <circle cx="36.4" cy="12.9" r="3.2" />
      <circle cx="36.4" cy="24" r="3.2" />
      <circle cx="36.4" cy="35.1" r="3.2" />
    </g>
    <rect x="6" y="17.8" width="12.4" height="12.4" rx="3.7" fill="#AB1268" />
  </g>
</svg>
